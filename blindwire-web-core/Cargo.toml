[package]
name = "blindwire-web-core"
version = "2.0.0"
edition = "2021"
description = "WebAssembly feasibility boundary for BlindWire protocol core"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blindwire-core = { path = "../blindwire-core", features = ["worker-recovery-snapshot"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
zeroize = "1.7"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
