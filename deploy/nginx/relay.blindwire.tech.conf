server {
    listen 80;
    listen [::]:80;
    server_name relay.blindwire.tech;

    access_log off;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name relay.blindwire.tech;

    ssl_certificate /etc/letsencrypt/live/relay.blindwire.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.blindwire.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BlindWireTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log off;
    error_log /var/log/nginx/blindwire-relay-error.log warn;
    server_tokens off;
    client_max_body_size 8k;

    location = /healthz {
        add_header Cache-Control "no-store";
        return 204;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 30s;
    }
}
